[package]
name = "murmur"
version = "0.1.10"
description = "Local speech-to-text desktop client powered by audio.cpp"
authors = ["Murmur contributors"]
edition = "2021"
rust-version = "1.85"

[lib]
name = "murmur_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.7.3", features = [] }

[dependencies]
tauri = { version = "2.12.4", features = ["macos-private-api", "protocol-asset"] }
tauri-plugin-dialog = "2.8.3"
tauri-plugin-opener = "2.7.2"
tauri-plugin-clipboard-manager = "2.5.0"
tauri-plugin-single-instance = "2.5.4"
tauri-plugin-log = "2.10.1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
log = "0.4"
libloading = "0.9"
parking_lot = "0.12"
crossbeam-channel = "0.5"
cpal = "0.18"
symphonia = { version = "0.6", default-features = false, features = ["all-codecs", "all-formats"] }
flate2 = "1"
hound = "3.5"
reqwest = { version = "0.13", default-features = false, features = ["rustls", "stream", "json", "http2"] }
tokio = { version = "1", features = ["rt-multi-thread", "macros", "fs", "io-util", "net", "sync", "time"] }
futures-util = "0.3"
sha2 = "0.11"
uuid = { version = "1", features = ["v4"] }
axum = { version = "0.8", default-features = false, features = ["http1", "json", "multipart", "query", "tokio"] }

[profile.release]
codegen-units = 1
lto = true
opt-level = 3
strip = true
panic = "unwind"

# Build scripts and proc-macros must keep their metadata.
[profile.release.build-override]
strip = false
opt-level = 0
