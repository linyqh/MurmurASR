name: release

# Builds the Windows installer and attaches it to a draft GitHub Release.
# The macOS DMG is built, signed and notarized locally with
# scripts/release-macos.sh, which uploads to the same draft.
# Runs only on demand to keep Actions usage low:
#   - push a tag matching the app version:  git tag v0.1.11 && git push origin v0.1.11
#   - or Actions → release → Run workflow (uses the version in tauri.conf.json)
# The compiled audio.cpp engine is cached per upstream release, so most runs
# skip the engine build and the Vulkan SDK install entirely.

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write

env:
  GH_TOKEN: ${{ github.token }}

jobs:
  prepare:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      tag: ${{ steps.meta.outputs.tag }}
      audiocpp: ${{ steps.meta.outputs.audiocpp }}
      build: ${{ steps.release.outputs.build }}
    steps:
      - uses: actions/checkout@v7
        with:
          sparse-checkout: src-tauri/tauri.conf.json
          sparse-checkout-cone-mode: false

      - name: Resolve version, tag and audio.cpp release
        id: meta
        run: |
          version=$(jq -r .version src-tauri/tauri.conf.json)
          tag="v$version"
          # A tag that disagrees with the app version would ship mislabelled installers.
          if [[ "$GITHUB_REF_TYPE" == tag && "$GITHUB_REF_NAME" != "$tag" ]]; then
            echo "::error::Tag $GITHUB_REF_NAME does not match app version $version"
            exit 1
          fi
          audiocpp=$(git ls-remote --tags --refs https://github.com/0xShug0/audio.cpp.git 'v*' |
            sed 's#.*refs/tags/##' | grep -E '^v[0-9]+\.[0-9]+\.[0-9]+$' | sort -V | tail -n 1)
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          echo "audiocpp=$audiocpp" >> "$GITHUB_OUTPUT"
          echo "MurmurASR $tag, audio.cpp $audiocpp"

      # Publishing a draft creates its tag, which triggers this workflow again;
      # a release that is already published must not be rebuilt or overwritten.
      - name: Create draft release
        id: release
        run: |
          tag=${{ steps.meta.outputs.tag }}
          draft=$(gh release view "$tag" -R "$GITHUB_REPOSITORY" --json isDraft -q .isDraft 2>/dev/null || true)
          if [[ "$draft" == false ]]; then
            echo "::notice::$tag is already published; skipping the build"
            echo "build=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          [[ "$draft" == true ]] ||
            gh release create "$tag" -R "$GITHUB_REPOSITORY" --draft --target "$GITHUB_SHA" \
              --title "MurmurASR $tag" --generate-notes
          echo "build=true" >> "$GITHUB_OUTPUT"

  windows:
    needs: prepare
    if: needs.prepare.outputs.build == 'true'
    runs-on: windows-2022
    timeout-minutes: 75
    env:
      AUDIOCPP_REF: ${{ needs.prepare.outputs.audiocpp }}
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - name: Cache engine
        id: engine
        uses: actions/cache@v6
        with:
          path: src-tauri/resources/engine
          key: engine-windows-vulkan-${{ env.AUDIOCPP_REF }}-${{ hashFiles('engine/audiocpp.conf', 'engine/scripts/build-engine.ps1') }}

      # Only needed to compile the engine; the cached engine already bundles
      # the Vulkan loader.
      - name: Vulkan SDK
        id: vulkan
        if: steps.engine.outputs.cache-hit != 'true'
        uses: jakoch/install-vulkan-sdk-action@v1
        with:
          install_runtime: true

      - run: npm ci

      - name: Package
        shell: pwsh
        env:
          VULKAN_SDK: ${{ steps.vulkan.outputs.VULKAN_SDK }}
        run: ./scripts/package-windows.ps1

      - name: Upload to release
        shell: bash
        run: |
          gh release upload "${{ needs.prepare.outputs.tag }}" --clobber \
            src-tauri/target/release/bundle/nsis/*-setup.exe \
            src-tauri/target/release/bundle/nsis/*-setup.exe.sha256
