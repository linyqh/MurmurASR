name: pages

# Publishes the landing page in site/ to GitHub Pages.
# One-time setup: Settings → Pages → Source: "GitHub Actions".

on:
  push:
    branches: [main]
    paths: ["site/**", "assets/screenshots/**", "assets/icon/app-icon.png", ".github/workflows/pages.yml"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v7
      # Images live in assets/ (shared with the README); copy them next to the page.
      - name: Assemble site
        run: |
          mkdir -p _site/assets/icon
          cp -r site/. _site/
          cp -r assets/screenshots _site/assets/
          cp assets/icon/app-icon.png _site/assets/icon/
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - id: deployment
        uses: actions/deploy-pages@v4
